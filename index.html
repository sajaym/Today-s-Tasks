<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sunil · Payments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  :root {
    /* warm paper palette */
    --paper: #f5f2ea;
    --ink: #1f1d18;
    --ink-2: #6b665b;
    --ink-3: #9a9487;
    --clay: #d97757;
    --clay-deep: #b9532f;
    --clay-glow: rgba(217,119,87,.30);
    --sage: #4f8a5b;
    --glass-fill: rgba(255,253,248,.55);
    --glass-fill-2: rgba(255,253,248,.28);
    --glass-edge: rgba(255,255,255,.85);
    --glass-edge-low: rgba(120,100,70,.14);
    --shadow: 0 1px 2px rgba(60,40,10,.06), 0 12px 32px -8px rgba(60,40,10,.18);
    --serif: "Newsreader", "Tiempos Headline", Georgia, "Times New Roman", serif;
    --sans: "Inter", -apple-system, "SF Pro Text", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #181714;
      --ink: #f1ede3;
      --ink-2: #a8a295;
      --ink-3: #75706a;
      --clay-glow: rgba(217,119,87,.22);
      --sage: #7fc08d;
      --glass-fill: rgba(48,45,38,.52);
      --glass-fill-2: rgba(48,45,38,.26);
      --glass-edge: rgba(255,255,255,.22);
      --glass-edge-low: rgba(255,255,255,.06);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -10px rgba(0,0,0,.6);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--paper); }
  body { font-family: var(--sans); color: var(--ink); display: flex; justify-content: center; -webkit-font-smoothing: antialiased; }

  .app { position: relative; width: 100%; max-width: 430px; height: 100dvh; overflow: hidden; isolation: isolate; }

  /* soft atmosphere: the light the glass bends */
  .app::before, .app::after { content: ""; position: absolute; z-index: -1; border-radius: 50%; filter: blur(60px); pointer-events: none; }
  .app::before { width: 340px; height: 340px; right: -140px; top: 22%; background: var(--clay-glow); }
  .app::after  { width: 300px; height: 300px; left: -150px; bottom: 6%; background: color-mix(in srgb, var(--clay) 14%, transparent); }

  /* ---------- liquid glass ---------- */
  .glass {
    position: relative;
    background: linear-gradient(160deg, var(--glass-fill), var(--glass-fill-2));
    -webkit-backdrop-filter: blur(22px) saturate(1.7) brightness(1.04);
            backdrop-filter: blur(22px) saturate(1.7) brightness(1.04);
    box-shadow: var(--shadow);
  }
  /* luminous rim: bright top-left, faint bottom-right, like light caught on an edge */
  .glass::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(145deg, var(--glass-edge), transparent 38%, transparent 62%, var(--glass-edge-low));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }

  /* ---------- header ---------- */
  header {
    position: absolute; z-index: 10; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px;
    height: 68px; border-radius: 34px; padding: 0 8px 0 8px;
    display: flex; align-items: center; gap: 10px;
  }
  .icon-btn { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; transition: background .2s, transform .15s; }
  .icon-btn:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  .monogram { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--serif); font-size: 22px; font-weight: 500; color: #fff;
    background: radial-gradient(circle at 30% 20%, #eb9674, var(--clay) 55%, var(--clay-deep));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 4px 12px -2px var(--clay-glow); }
  .who { flex: 1; min-width: 0; line-height: 1.2; }
  .who h1 { font-family: var(--serif); font-weight: 500; font-size: 21px; letter-spacing: -.01em; }
  .who p { font-size: 12.5px; color: var(--ink-2); margin-top: 1px; font-variant-numeric: tabular-nums; }

  /* ---------- conversation ---------- */
  main { position: absolute; inset: 0; overflow-y: auto; padding: 100px 14px 108px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; }
  main::-webkit-scrollbar { display: none; }

  .day { align-self: stretch; display: flex; align-items: center; gap: 14px; margin: 18px 6px 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
  .day::before, .day::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--glass-edge-low)); }
  .day::after { background: linear-gradient(270deg, transparent, var(--glass-edge-low)); }

  .row { display: flex; align-items: flex-end; gap: 8px; animation: settle .7s cubic-bezier(.16,1,.3,1) backwards; }
  .row.out { justify-content: flex-end; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  @keyframes settle { from { opacity: 0; transform: translateY(14px) scale(.97); filter: blur(4px); } }
  .row:nth-of-type(1) { animation-delay: .05s; } .row:nth-of-type(2) { animation-delay: .15s; }

  .avatar { width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center; margin-bottom: 4px; }
  .avatar.them { font-family: var(--serif); font-size: 15px; color: var(--ink-2); background: color-mix(in srgb, var(--ink) 9%, transparent); }
  .avatar.me { background: var(--clay); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.4); }
  .avatar svg { width: 17px; height: 17px; }

  /* payment card */
  .pay { width: 268px; border-radius: 26px; padding: 15px 16px 16px 20px; cursor: pointer; overflow: hidden;
    transition: transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s; }
  .pay:hover { transform: translateY(-2px); }
  .pay:active { transform: scale(.985); }
  .pay > * { position: relative; z-index: 1; }

  .top { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; font-weight: 600; color: var(--ink-2); }
  .status { display: inline-flex; align-items: center; gap: 7px; }
  .status i { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: var(--sage); }
  .status i svg { width: 10px; height: 10px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .top time { font-weight: 500; letter-spacing: .02em; text-transform: none; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .figure { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .amount { font-family: var(--serif); font-weight: 400; font-size: 46px; line-height: 1; letter-spacing: -.025em; font-variant-numeric: lining-nums tabular-nums; }
  .amount sup { font-size: .5em; vertical-align: .55em; margin-right: 3px; letter-spacing: 0; color: var(--ink-2); font-weight: 400; }
  .go { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--ink) 7%, transparent); transition: transform .35s cubic-bezier(.16,1,.3,1), background .2s; }
  .pay:hover .go { transform: translateX(3px); background: color-mix(in srgb, var(--ink) 12%, transparent); }
  .go svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* paid = clay glass */
  .pay.paid {
    color: #fff;
    background: linear-gradient(155deg, rgba(234,142,108,.92), rgba(196,92,56,.88) 70%, rgba(176,76,44,.92));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -10px 24px -12px rgba(120,40,10,.5), 0 14px 34px -10px rgba(185,83,47,.55);
  }
  .pay.paid::before { background: linear-gradient(145deg, rgba(255,255,255,.7), transparent 40%, transparent 65%, rgba(255,255,255,.18)); }
  .pay.paid .top, .pay.paid .top time, .pay.paid .amount sup { color: rgba(255,255,255,.82); }
  .pay.paid .status i { background: rgba(255,255,255,.95); }
  .pay.paid .status i svg { stroke: var(--clay-deep); }
  .pay.paid .go { background: rgba(255,255,255,.2); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
  .pay.paid:hover .go { background: rgba(255,255,255,.3); }
  .pay.paid::after { /* specular sweep */
    content: ""; position: absolute; z-index: 0; inset: 0; pointer-events: none;
    background: radial-gradient(90% 60% at 15% -10%, rgba(255,255,255,.35), transparent 60%);
  }

  .bubble { max-width: 76%; padding: 11px 16px; border-radius: 22px 22px 6px 22px; font-size: 16px; line-height: 1.4; color: #fff; background: linear-gradient(155deg, #e58a68, var(--clay-deep)); box-shadow: 0 8px 20px -8px rgba(185,83,47,.6), inset 0 1px 0 rgba(255,255,255,.35); }

  /* ---------- composer ---------- */
  footer { position: absolute; z-index: 10; left: 12px; right: 12px; bottom: max(14px, env(safe-area-inset-bottom)); }
  .composer { height: 64px; border-radius: 32px; display: flex; align-items: center; padding: 0 8px 0 24px; gap: 2px; transition: box-shadow .3s; }
  .composer:focus-within { box-shadow: var(--shadow), 0 0 0 3px color-mix(in srgb, var(--clay) 28%, transparent); }
  .composer input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font: 400 17px var(--sans); caret-color: var(--clay); }
  .composer input::placeholder { color: var(--ink-3); }
  .badge { position: relative; }
  .badge::after { content: ""; position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--clay); box-shadow: 0 0 0 2px var(--paper); }
  .send { width: 48px; height: 48px; flex: none; margin-left: 4px; border: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center;
    color: var(--ink-3); background: color-mix(in srgb, var(--ink) 8%, transparent); transition: all .3s cubic-bezier(.16,1,.3,1); }
  .send svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s; }
  .send.ready { color: #fff; background: linear-gradient(145deg, #e58a68, var(--clay-deep)); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 8px 18px -6px rgba(185,83,47,.7); }
  .send.ready svg { transform: translateY(-1px) rotate(-8deg); }
  .send:active { transform: scale(.9); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="spark" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 2.5v19"/><path d="M2.5 12h19"/><path d="M5.3 5.3l13.4 13.4"/><path d="M18.7 5.3L5.3 18.7"/></g></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
</svg>

<div class="app">
  <header class="glass">
    <button class="icon-btn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="monogram">S</div>
    <div class="who"><h1>Sunil</h1><p>+91 97832 88761</p></div>
    <button class="icon-btn" aria-label="Reminders"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4.2l2.6 1.6M4 5.5L6.6 3M20 5.5L17.4 3"/></svg></button>
    <button class="icon-btn" aria-label="Help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 015.4 1c0 1.8-2.7 2.2-2.7 4M12 17.6h.01"/></svg></button>
  </header>

  <main id="chat">
    <div class="row">
      <div class="avatar them">S</div>
      <div class="group">
        <article class="pay glass">
          <div class="top"><span class="status"><i><svg><use href="#check"/></svg></i>Received</span><time>6:13 PM</time></div>
          <div class="figure"><div class="amount"><sup>₹</sup>1,000</div><span class="go"><svg viewBox="0 0 24 24"><use href="#arrow"/></svg></span></div>
        </article>
        <article class="pay glass">
          <div class="top"><span class="status"><i><svg><use href="#check"/></svg></i>Received</span><time>6:13 PM</time></div>
          <div class="figure"><div class="amount"><sup>₹</sup>2,000</div><span class="go"><svg viewBox="0 0 24 24"><use href="#arrow"/></svg></span></div>
        </article>
      </div>
    </div>

    <div class="day">September 04, 2026</div>

    <div class="row out">
      <article class="pay paid glass">
        <div class="top"><span class="status"><i><svg><use href="#check"/></svg></i>Paid</span><time>10:34 AM</time></div>
        <div class="figure"><div class="amount"><sup>₹</sup>1,500</div><span class="go"><svg viewBox="0 0 24 24"><use href="#arrow"/></svg></span></div>
      </article>
      <div class="avatar me"><svg><use href="#spark"/></svg></div>
    </div>

    <div class="day">Today</div>

    <div class="row out">
      <article class="pay paid glass">
        <div class="top"><span class="status"><i><svg><use href="#check"/></svg></i>Paid</span><time>6:22 PM</time></div>
        <div class="figure"><div class="amount"><sup>₹</sup>1,500</div><span class="go"><svg viewBox="0 0 24 24"><use href="#arrow"/></svg></span></div>
      </article>
      <div class="avatar me"><svg><use href="#spark"/></svg></div>
    </div>
  </main>

  <footer>
    <form class="composer glass" id="form" autocomplete="off">
      <input id="msg" placeholder="Enter amount or chat" enterkeyhint="send" aria-label="Message">
      <button type="button" class="icon-btn badge" aria-label="Calculator"><svg viewBox="0 0 24 24"><rect x="4.5" y="3" width="15" height="18" rx="3.5"/><path d="M8 8h3M9.5 6.5v3M14 8.5h2.2M8.3 14.2l2.8 2.8M11.1 14.2l-2.8 2.8M14 14.6h2.4M14 17.4h2.4"/></svg></button>
      <button type="button" class="icon-btn" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 8v8M8 12h8"/></svg></button>
      <button class="send" id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></button>
    </form>
  </footer>
</div>

<script>
  const chat = document.getElementById('chat'), msg = document.getElementById('msg'), send = document.getElementById('send');
  const sym = id => `<svg viewBox="0 0 24 24"><use href="#${id}"/></svg>`;
  msg.addEventListener('input', () => send.classList.toggle('ready', msg.value.trim() !== ''));
  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const v = msg.value.trim(); if (!v) return;
    const n = Number(v.replace(/[,₹\s]/g, ''));
    const time = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const row = document.createElement('div'); row.className = 'row out';
    if (isNaN(n) || n <= 0) {
      const b = document.createElement('div'); b.className = 'bubble'; b.textContent = v; row.append(b);
    } else {
      row.innerHTML = `<article class="pay paid glass"><div class="top"><span class="status"><i><svg><use href="#check"/></svg></i>Paid</span><time>${time}</time></div><div class="figure"><div class="amount"><sup>₹</sup>${n.toLocaleString('en-IN')}</div><span class="go">${sym('arrow')}</span></div></article>`;
    }
    row.insertAdjacentHTML('beforeend', `<div class="avatar me">${sym('spark')}</div>`);
    chat.append(row); chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
    msg.value = ''; send.classList.remove('ready');
  });
  chat.scrollTop = chat.scrollHeight;
</script>
</body>
</html>
